<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FEE04A" />
  <title>Sign in · CAL Seating Chart</title>
  <link rel="stylesheet" href="/static/styles.css?v=2.8.0" />
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="loginTitle">
    <div class="auth-accent"></div>
    <div class="auth-content">
      <img class="auth-logo" src="/static/assets/cal-logo.png" alt="Center for Advanced Learning" />
      <div class="auth-kicker">TEACHER TOOL</div>
      <h1 id="loginTitle">Seating Chart</h1>
      <p>Sign in with the local teacher account created by your administrator.</p>
      <form class="auth-form" id="loginForm">
        <label class="field">
          <span>Email</span>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="form-error" id="loginError" role="alert"></div>
        <button class="filled-button" id="loginBtn" type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <script src="/static/login.js?v=2.8.0"></script>
</body>
</html>
