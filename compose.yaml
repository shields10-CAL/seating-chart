services:
  seating-chart:
    build:
      context: .
    image: seating-chart:local
    container_name: seating-chart
    restart: unless-stopped
    ports:
      - "3005:3000"
    env_file:
      - ../config/.env
    volumes:
      - ../data:/app/data
      - ../backups:/app/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
